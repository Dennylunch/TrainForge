{% extends "base.html" %}

{% block content %}
<div style="background: linear-gradient(135deg, #166534 0%, #16a34a 55%, #f59e0b 100%); min-height: 100vh;"> 
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 pb-4">
        <div class="bg-light px-5 pt-5 pb-3 mt-3 rounded-4">
          <h3 class="text-center text-success"><b>Edit the exercise item</b></h3>
          <form method="post" class="mt-3">
            {% csrf_token %}
            <div class="my-3">
                <label for="edit_ex_name" class="form-label col-12 col-md-6"></label>
                <input type="text" class="form-control col-12 col-md-6" id="edit_ex_name" value="{{ exercise_item.exercise_name_copy }}" name="exercise_name_copy" required>
            </div>
            <button type="submit" class="btn btn-success col-12 px-2 my-2">Save</button>
            <a href="{% url 'exercise_item' %}" class="btn btn-outline-success col-12 px-2 my-2">Cancel</a>
          </form>
        </div>
      </div>

                        
    </div>
  </div>
</div>
{% endblock %}
