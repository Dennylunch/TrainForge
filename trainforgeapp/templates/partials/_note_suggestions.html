<div class="list-group">
  {% for suggestion in suggestions %}
    <div class="list-group-item d-flex justify-content-between align-items-start">
      <div class="me-3 flex-grow-1">{{ suggestion|linebreaks }}</div>
      <form hx-post="{% url 'select_ai_note' client_id=client.id %}"
            hx-target="#note-section-{{client.id}}"
            hx-swap="outerHTML">
        <input type="hidden" name="newnote" value="{{ suggestion }}">
        <button type="submit" class="btn btn-success btn-sm text-nowrap">
          <i class="bi bi-check-lg"></i> Select
        </button>
      </form>
    </div>
  {% empty %}
    <div class="list-group-item text-danger">No suggestions could be generated. Please try again.</div>
  {% endfor %}
</div>
