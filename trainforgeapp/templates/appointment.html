{% extends "base.html" %}

{% block title %}Appointment | TrainForge{% endblock %}

{% block content %}
    
    <div style="background: linear-gradient(135deg, #166534 0%, #16a34a 55%, #f59e0b 100%); min-height: 100vh;"> 
        <section>
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-8 col-lg-6">
                            <div class="bg-light px-5 pt-5 pb-3 mt-3 rounded-4">
                                <h1 class="text-center mb-4 text-success"><b>Appointment</b></h1>
                                <form method="post">
                                    {% csrf_token %}

                                    <div class="row justify-content-center">
                                        <h6>Client Name: {{client.first_name}} {{client.last_name}}</h6>
                                        <div class="mb-3">
                                            <label for="pre_app_t" class="form-label mb-1">Preferred appointment time</label>
                                            <textarea class="form-control mb-2" id="pre_app_t" style="height: 100px" name="preferred_app_time_notes">{{ client.preferred_app_time_notes|default:'' }}</textarea>
                                        </div>
                                        
                                        <hr class="mt-3">
                                        <h5 class="text-center pb-2"><u>Actual appointment</u></h5>
                                        <h6>Schedule an appointment</h6>
                                        <div class="mb-3">
                                            <label for="app_date" class="form-label">Appointment date</label>
                                            <input type="date" class="form-control" id="app_date" name="date">
                                        </div>
                                        <div class="mb-3">
                                            <label for="start_t" class="form-label">Expected time slot</label>
                                            <select class="form-select mb-3" id="start_t" name="starting_time">
                                                <option selected disabled value="">Choose one</option>
                                                <option value="08:00">08:00 -- 09:00</option>
                                                <option value="09:00">09:00 -- 10:00</option>
                                                <option value="10:00">10:00 -- 11:00</option>
                                                <option value="11:00">11:00 -- 12:00</option>
                                                <option value="12:00">12:00 -- 13:00</option>
                                                <option value="13:00">13:00 -- 14:00</option>
                                                <option value="14:00">14:00 -- 15:00</option>
                                                <option value="15:00">15:00 -- 16:00</option>
                                                <option value="16:00">16:00 -- 17:00</option>
                                                <option value="17:00">17:00 -- 18:00</option>
                                                <option value="18:00">18:00 -- 19:00</option>
                                                <option value="19:00">19:00 -- 20:00</option>
                                            </select>
                                        </div>
                                    
                                        <div class="mb-3">
                                            <label for="app_purpose" class="form-label mb-1">Purpose / Note</label>
                                            <textarea class="form-control mb-2" id="app_purpose" style="height: 100px" name="purpose"></textarea>
                                        </div>
                                        
                                        <div class="text-center pt-2">
                                            <button type="submit" class="btn btn-success px-4">Save appointment</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div class="p-2"></div>
                    </div>
                </div>
            </section>
    </div>
{% endblock %}
