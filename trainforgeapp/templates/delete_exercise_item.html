{% extends "base.html" %}

{% block content %}
<div style="background: linear-gradient(135deg, #166534 0%, #16a34a 55%, #f59e0b 100%); min-height: 100vh;"> 
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 pb-4">
        <div class="bg-light px-5 pt-5 pb-3 mt-3 rounded-4">
          <h3 class="text-center text-danger"><b>Delete your exercise?</b></h3>
          <p class="text-center pt-3 col-12">The exercise will be permanently deleted and cannot be recovered.</p>
          <p class="text-center">Are you sure?</p>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger col-12 px-2 my-1">Delete</button>
            <a href="{% url 'exercise_item' %}" class="btn btn-outline-danger col-12 px-2 my-1">Cancel</a>
          </form>
        </div>
      </div>

                        
    </div>
  </div>
</div>
{% endblock %}
