<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | TrainForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>

  <body>
    <main class="d-flex align-items-center py-5" style="background: radial-gradient(circle at 80% 15%, rgba(245, 158, 11, 0.4), transparent 24rem), linear-gradient(135deg, #052e16 0%, #15803d 100%); min-height: 100vh;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-5">
            <div class="text-center text-white mb-4">
              <a class="text-white text-decoration-none" href="{% url 'root' %}">
                <span class="fs-3 fw-bold"><i class="bi bi-lightning-charge-fill me-1"></i>TrainForge</span>
              </a>
              <p class="text-white-50 mt-2 mb-0">Return to your coaching workspace.</p>
            </div>

            <div class="bg-white p-4 p-md-5 rounded-4 shadow-lg">
              <h1 class="h2 text-center mb-4 fw-bold">Welcome back</h1>

              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
                {% endfor %}
              {% endif %}

              <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                  <label for="user_email" class="form-label">Email <span class="text-danger">*</span></label>
                  <input type="email" class="form-control form-control-lg" id="user_email" name="username" autocomplete="email" required>
                </div>
                <div class="mb-4">
                  <label for="user_pw" class="form-label">Password <span class="text-danger">*</span></label>
                  <input type="password" class="form-control form-control-lg" id="user_pw" minlength="8" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100">Sign in</button>
              </form>

              <p class="text-center text-body-secondary mt-4 mb-0">New to TrainForge? <a href="{% url 'signup' %}" class="link-success fw-semibold">Create an account</a>.</p>
            </div>

            <div class="text-center mt-4">
              <a class="link-light link-underline-opacity-0 me-3" href="{% url 'privacy_policy' %}">Privacy</a>
              <a class="link-light link-underline-opacity-0" href="{% url 'terms_of_service' %}">Terms</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
