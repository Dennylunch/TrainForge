name: Bug report
description: Report a reproducible problem in TrainForge.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TrainForge. Do not include secrets or real client data.

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that demonstrates the issue.
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. Submit ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include operating system, browser, Python version, and whether this is local or the hosted demo.
      placeholder: Windows 11, Firefox 128, Python 3.14, local
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials and personal information before attaching anything.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and real client information.
          required: true
