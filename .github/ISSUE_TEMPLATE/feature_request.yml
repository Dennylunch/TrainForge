name: Feature request
description: Propose a focused improvement to TrainForge.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or developer need would this address?
      placeholder: Explain the underlying need rather than only the proposed interface.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful version of the improvement.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note existing workflows or simpler approaches you considered.

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Client and plan management
        - Exercise catalogue
        - Scheduling
        - AI-assisted suggestions
        - Authentication and security
        - Documentation and developer experience
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This proposal does not depend on real client data or exposed credentials.
          required: true
